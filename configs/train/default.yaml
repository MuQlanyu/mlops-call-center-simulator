# @package _global_
train:
  max_epochs: 10
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  accelerator: auto
  devices: 1
  precision: 16-mixed
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  early_stopping:
    monitor: val_mape_ocean
    patience: 5
    mode: min
  checkpoint:
    monitor: val_mape_ocean
    mode: min
    save_top_k: 1
    filename: "best-{epoch:02d}-{val_mape_ocean:.4f}"
