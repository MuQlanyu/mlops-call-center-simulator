[project]
name = "call-center-simulator"
version = "0.1.0"
description = "Call-center operator trainer via OCEAN-steered LLM"
authors = [
    {name = "Мун Павел Юрьевич"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "lightning>=2.2.0",
    "transformers>=4.45.0",
    "datasets>=2.19.0",
    "hydra-core>=1.3.0",
    "mlflow>=2.14.0",
    "dvc>=3.50.0",
    "gradio>=4.40.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "nltk>=3.8.0",
    "rouge-score>=0.1.2",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["call_center_simulator"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["call_center_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
